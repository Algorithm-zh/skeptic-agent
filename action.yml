name: Skeptic verification
description: Independently verify an AI-written change, enforce test integrity, and publish an evidence receipt.
author: Skeptic contributors
branding:
  icon: check-circle
  color: green

inputs:
  repository:
    description: Repository path to verify, relative to the workspace.
    required: false
    default: .
  base:
    description: Base git ref or SHA. Pass the pull request base SHA for a committed range.
    required: false
    default: ""
  head:
    description: Head git ref or SHA. Defaults to HEAD.
    required: false
    default: HEAD
  claims:
    description: Completion claims made by the agent (for example "All tests pass. Fixes #42.").
    required: false
    default: ""
  fail-on:
    description: Exit non-zero threshold (warnings, unverified, or never).
    required: false
    default: unverified
  node-version:
    description: Node.js version used to run Skeptic.
    required: false
    default: "22"
  upload-artifact:
    description: Upload the receipt, report, and logs as a workflow artifact.
    required: false
    default: "true"

outputs:
  verdict:
    description: verified, verified_with_warnings, unverified, or failed.
    value: ${{ steps.verify.outputs.verdict }}
  receipt:
    description: Path to the receipt JSON, when verification produced one.
    value: ${{ steps.verify.outputs.receipt }}
  report:
    description: Path to the Markdown report, when verification produced one.
    value: ${{ steps.verify.outputs.report }}
  run-dir:
    description: Path to the Skeptic run directory.
    value: ${{ steps.verify.outputs.run-dir }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Build Skeptic
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        npm ci --ignore-scripts
        npm run build

    - name: Verify the change
      id: verify
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        SKEPTIC_REPOSITORY: ${{ inputs.repository }}
        SKEPTIC_BASE: ${{ inputs.base }}
        SKEPTIC_HEAD: ${{ inputs.head }}
        SKEPTIC_CLAIMS: ${{ inputs.claims }}
        SKEPTIC_FAIL_ON: ${{ inputs.fail-on }}
        SKEPTIC_ACTION_PATH: ${{ github.action_path }}
      run: |
        set +e
        ARGS=(verify "$SKEPTIC_REPOSITORY" --head "$SKEPTIC_HEAD" --fail-on "$SKEPTIC_FAIL_ON" --markdown)
        if [ -n "$SKEPTIC_BASE" ]; then ARGS+=(--base "$SKEPTIC_BASE"); fi
        if [ -n "$SKEPTIC_CLAIMS" ]; then ARGS+=(--claims "$SKEPTIC_CLAIMS"); fi
        node "$SKEPTIC_ACTION_PATH/dist/cli.js" "${ARGS[@]}" > skeptic-report.out 2> skeptic-progress.log
        STATUS=$?
        set -e

        cat skeptic-progress.log >&2 || true
        cat skeptic-report.out

        RUN_DIR=$(ls -td "$SKEPTIC_REPOSITORY"/.skeptic/runs/*/ 2>/dev/null | head -n 1)
        RUN_DIR=${RUN_DIR%/}
        if [ -n "$RUN_DIR" ]; then
          echo "run-dir=$RUN_DIR" >> "$GITHUB_OUTPUT"
          {
            echo "## Skeptic verification"
            echo
            cat "$RUN_DIR/report.md"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RUN_DIR/receipt.json" ]; then
            echo "verdict=$(node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(r.verdict.level)' "$RUN_DIR/receipt.json")" >> "$GITHUB_OUTPUT"
            echo "receipt=$RUN_DIR/receipt.json" >> "$GITHUB_OUTPUT"
            echo "report=$RUN_DIR/report.md" >> "$GITHUB_OUTPUT"
          fi
        else
          {
            echo "## Skeptic verification"
            echo
            echo '```'
            cat skeptic-report.out skeptic-progress.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        fi

        exit $STATUS

    - name: Upload evidence
      if: ${{ always() && inputs.upload-artifact == 'true' && steps.verify.outputs.run-dir != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: skeptic-evidence-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ steps.verify.outputs.run-dir }}
        if-no-files-found: warn
        retention-days: 30
